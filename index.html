<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>有休ウォッチ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="有休ウォッチ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff8ec">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2350;--sub:#7a729c;--line:#2b2350;
  --pink:#ff7eb6;--pink-l:#ffe1ef;--yellow:#ffd23f;--yellow-l:#fff4c7;
  --mint:#3ddbb0;--mint-l:#d6fbef;--sky:#5cc8ff;--sky-l:#dcf3ff;
  --purple:#9b7bff;--purple-l:#ece5ff;--red:#ff5a5f;--red-l:#ffe3e3;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{touch-action:manipulation}
body{margin:0;color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;line-height:1.6;
  background:#fff8ec;
  background-image:radial-gradient(var(--pink-l) 2px,transparent 2px),radial-gradient(var(--sky-l) 2px,transparent 2px);
  background-size:28px 28px;background-position:0 0,14px 14px}
main{max-width:760px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header .logo{width:52px;height:52px;border-radius:16px;background:var(--yellow);border:3px solid var(--line);
  box-shadow:4px 4px 0 var(--line);display:grid;place-items:center;font-size:28px;transform:rotate(-6deg)}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:.02em}
h1 small{display:block;font-size:13px;font-weight:700;color:var(--sub)}
.card{background:#fff;border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--line);padding:18px 20px;margin-top:22px}
.card h3{margin:0 0 12px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.m{border:3px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:4px 4px 0 var(--line);transition:transform .15s}
.m:hover{transform:translate(-2px,-2px) rotate(-1deg)}
.m .ml{font-size:13px;font-weight:700}
.m .mv{font-size:30px;font-weight:800;line-height:1.2}
.m .mv small{font-size:16px}
.m1{background:var(--pink-l)}.m2{background:var(--yellow-l)}.m3{background:var(--mint-l)}.m4{background:var(--purple-l)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--sub)}
input,select{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2.5px solid var(--line);border-radius:12px;height:42px;padding:0 12px;outline:none}
input:focus,select:focus{background:var(--yellow-l)}
button{font:inherit;font-weight:800;cursor:pointer;color:var(--ink);border:2.5px solid var(--line);border-radius:999px;
  height:42px;padding:0 20px;box-shadow:3px 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.b-pink{background:var(--pink);color:#fff}.b-mint{background:var(--mint)}.b-plain{background:#fff}
.del{height:32px;padding:0 12px;font-size:13px;background:#fff;box-shadow:2px 2px 0 var(--line)}
.err{font-size:13px;font-weight:700;color:var(--red);min-height:20px;margin-top:6px}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 12px;border:2px dashed #d9d3f0;border-radius:14px;margin-bottom:8px;font-size:14px;background:#fff}
.li .ml{font-size:12px;color:var(--sub);font-weight:700}
.li .gi{min-width:185px}
.li .gr{min-width:70px;text-align:right;font-weight:800}
@media (max-width:520px){.li .gi{flex-basis:100%;min-width:0}}
header .h-add{margin-left:auto;height:38px;padding:0 16px;font-size:14px;white-space:nowrap;flex-shrink:0}
h1{white-space:nowrap}
@media (max-width:400px){h1{font-size:22px}header .h-add{padding:0 12px}}
@media (max-width:340px){h1{font-size:19px}header .logo{width:42px;height:42px;font-size:22px}header{gap:8px}header .h-add{font-size:13px;padding:0 10px}}
dialog.card{margin:auto;width:min(420px,calc(100% - 32px));color:var(--ink)}
dialog::backdrop{background:rgba(43,35,80,.35)}
.dlg-actions{justify-content:flex-end;flex-wrap:nowrap;margin-top:8px}
.dlg-actions button{padding:0 14px}
.dlg-actions .b-danger{margin-right:auto;background:#fff;color:var(--red)}
.install{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:var(--sky-l);font-weight:700;font-size:14px}
.install .ml{font-size:12px;color:var(--sub);margin-top:4px}
.install .del{flex-shrink:0}
.warn{margin-bottom:16px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:var(--yellow-l);font-weight:700;font-size:14px}
.bar{flex:1;height:14px;background:var(--sky-l);border:2px solid var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.bar>div{height:100%;background:repeating-linear-gradient(45deg,var(--sky),var(--sky) 8px,#7fd6ff 8px,#7fd6ff 16px);border-right:2px solid var(--line)}
.tag{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;border:2px solid var(--line);margin-left:4px;white-space:nowrap}
.t-d{background:var(--red-l);color:var(--red)}.t-w{background:var(--yellow)}
.t-ok{background:var(--mint-l)}.t-p{background:var(--purple-l)}
.gr .lost{font-size:12px;color:var(--red)}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px}
.c-full{background:var(--pink-l);color:#d63384}.c-half{background:var(--sky-l);color:#1a7fb5}
.duty{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--purple-l);font-weight:700;font-size:14px}
.duty .bar{display:flex;margin-top:6px;background:#fff}
.duty .bar>.plan{background:repeating-linear-gradient(45deg,#d7cbff,#d7cbff 8px,#e9e2ff 8px,#e9e2ff 16px)}
.m .ml-row{display:flex;justify-content:space-between;gap:6px}
.m .ml-row b{color:#14866a}
.mini{display:flex;height:10px;margin:6px 0 4px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.mini>div{height:100%;background:var(--mint)}
.mini>.plan{background:repeating-linear-gradient(45deg,#a8f0dc,#a8f0dc 4px,#d6fbef 4px,#d6fbef 8px)}
.duty-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.duty-h b{font-size:20px}
.duty-h b small{font-size:13px}
.duty-s{font-size:12px;color:var(--sub);margin-top:4px}
.duty .bar>div{background:repeating-linear-gradient(45deg,var(--purple),var(--purple) 8px,#b49dff 8px,#b49dff 16px)}
details.old{margin-top:4px}
details.old summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--sub);padding:6px 4px}
details.old[open] summary{margin-bottom:6px}
.empty{color:var(--sub);font-weight:700;font-size:14px;text-align:center;padding:14px}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.confetti{position:fixed;top:-10px;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fall 1.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">🌴</div>
  <h1>有休ウォッチ<small>休むのも仕事のうち！</small></h1>
  <button id="gOpen" class="b-pink h-add">＋ 有休を追加</button>
</header>

<div class="install" id="install" hidden>
  <div style="flex:1">📱 ホーム画面に追加して使ってね
    <div style="font-size:13px;margin-top:4px">共有ボタン（□↑）→「ホーム画面に追加」<br>共有ボタンが見当たらなければ「…」の中にあります</div>
    <div class="ml">Safari で開いたまま記録すると、ホーム画面のアプリとは別のデータになります</div>
  </div>
  <button class="del" id="installClose">閉じる</button>
</div>
<div id="warn"></div>

<div class="grid">
  <div class="m m1"><div class="ml">🎒 残り</div><div class="mv" id="mRem">0</div></div>
  <div class="m m2"><div class="ml">⏰ 次に失効</div><div class="mv" id="mNext">-</div></div>
  <div class="m m3"><div class="ml ml-row">🏖️ 取得済み<b id="mUsedPct"></b></div><div class="mv" id="mUsed">0</div></div>
  <div class="m m4"><div class="ml">💨 失効済み</div><div class="mv" id="mLost">0</div></div>
</div>

<dialog id="gDlg" class="card">
  <h3>🎁 もらった有休を追加</h3>
  <div class="row">
    <label class="f">日数<input id="gDays" type="number" min="0.5" step="0.5" value="10" style="width:90px"></label>
    <label class="f">もらった日<input id="gStart" type="date"></label>
    <label class="f">期限<input id="gEnd" type="date"></label>
  </div>
  <div class="err" id="gErr"></div>
  <div class="row dlg-actions">
    <button id="gCancel" class="b-plain" autofocus>キャンセル</button>
    <button id="gAdd" class="b-pink">追加</button>
  </div>
</dialog>

<dialog id="uDlg" class="card">
  <h3>✏️ 記録を編集</h3>
  <div class="row">
    <label class="f">取得日<input id="eDate" type="date"></label>
    <label class="f">単位<select id="eDays"><option value="1">全休</option><option value="0.5">半休</option></select></label>
    <label class="f">メモ<input id="eMemo" type="text" style="width:170px"></label>
  </div>
  <div class="err" id="eErr"></div>
  <div class="row dlg-actions">
    <button id="eDel" class="b-danger">削除</button>
    <button id="eCancel" class="b-plain" autofocus>キャンセル</button>
    <button id="eSave" class="b-mint">保存</button>
  </div>
</dialog>

<div class="card">
  <h3>✈️ 休みを記録</h3>
  <div class="row">
    <label class="f">取得日<input id="uDate" type="date"></label>
    <label class="f">単位<select id="uDays"><option value="1">全休</option><option value="0.5">半休</option></select></label>
    <label class="f">メモ<input id="uMemo" type="text" placeholder="温泉旅行" style="width:170px"></label>
    <button id="uAdd" class="b-mint" style="margin-left:auto">記録する</button>
  </div>
  <div class="err" id="uErr"></div>
</div>

<div class="card">
  <h3>📦 有休の内訳</h3>
  <div id="gList"></div>
  <div id="duty"></div>
</div>

<div class="card">
  <h3>📅 取得履歴</h3>
  <div id="uList"></div>
</div>

<div class="row" style="margin-top:24px">
  <button id="exp" class="b-plain">💾 バックアップを保存</button>
  <button id="imp" class="b-plain">📂 バックアップから復元</button>
  <button id="helpBtn" class="b-plain" hidden>📱 ホーム画面に追加する方法</button>
  <input id="file" type="file" accept=".json" style="display:none">
  <span id="msg" style="font-weight:700;color:var(--sub)"></span>
</div>
</main>

<script>
const K = 'pto-tracker-v1';
let S = { grants: [], uses: [] };
try { const r = localStorage.getItem(K); if (r) S = JSON.parse(r); } catch (e) {}

const $ = id => document.getElementById(id);
// iOS Safari は user-scalable=no を無視するため、ピンチ操作そのものを止める
document.addEventListener('gesturestart', e => e.preventDefault());
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let today = iso(new Date());
const addY = (s, y) => { const d = new Date(s + 'T00:00:00'); d.setFullYear(d.getFullYear() + y); d.setDate(d.getDate() - 1); return iso(d); };
const fmt = n => (Math.round(n * 10) / 10).toString();
const dd = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const youbi = s => '日月火水木金土'[new Date(s + 'T00:00:00').getDay()];
const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(new Date(v + 'T00:00:00'));
const isHalf = v => typeof v === 'number' && v > 0 && Number.isInteger(v * 2);
const isData = d => d && Array.isArray(d.grants) && Array.isArray(d.uses)
  && d.grants.every(x => isHalf(x.days) && isDate(x.start) && isDate(x.end) && x.start <= x.end)
  && d.uses.every(u => (u.days === 1 || u.days === 0.5) && isDate(u.date) && (u.memo === undefined || typeof u.memo === 'string'));

// iOS はページからホーム画面への追加を呼び出せないので、手順を案内するだけにする
const KI = K + '-install-closed';
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
let installClosed = false;
try { installClosed = localStorage.getItem(KI) === '1'; } catch (e) {}
$('install').hidden = !isIOS || standalone || installClosed;
// ホーム画面から開いているなら案内は不要なので、再表示の入口も出さない
$('helpBtn').hidden = standalone;
$('helpBtn').onclick = () => { $('install').hidden = false; scrollTo({ top: 0, behavior: 'smooth' }); };
$('installClose').onclick = () => { $('install').hidden = true; try { localStorage.setItem(KI, '1'); } catch (e) {} };

$('gStart').value = today; $('gEnd').value = addY(today, 2); $('uDate').value = today;

function save() { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} }

const KE = K + '-exported';
const lastExport = () => { try { return localStorage.getItem(KE); } catch (e) { return null; } };
function markExported() { try { localStorage.setItem(KE, today); } catch (e) {} }

function confetti() {
  const colors = ['#ff7eb6', '#ffd23f', '#3ddbb0', '#5cc8ff', '#9b7bff'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = Math.random() * .4 + 's';
    c.style.animationDuration = 1 + Math.random() * .8 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2400);
  }
}
function pop(id) { const el = $(id); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

// 期限の近い付与分から順に引き当てる。paid[i] は uses[i] のうち付与から引き当てられた日数
function calc() {
  const g = S.grants.map((x, i) => ({ ...x, i, left: x.days, used: 0, planned: 0 }));
  const paid = S.uses.map(() => 0);
  S.uses.map((u, i) => ({ ...u, i }))
    .sort((a, b) => a.date.localeCompare(b.date))
    .forEach(u => {
      g.filter(x => x.start <= u.date && x.end >= u.date && x.left > 0)
        .sort((a, b) => a.end.localeCompare(b.end))
        .forEach(x => {
          const t = Math.min(u.days - paid[u.i], x.left);
          x.left -= t; x.used += t; paid[u.i] += t;
          if (u.date > today) x.planned += t;
        });
    });
  return { g, paid };
}

function render() {
  const { g, paid } = calc();
  const sumPaid = f => S.uses.reduce((s, u, i) => f(u) ? s + paid[i] : s, 0);
  const valid = g.filter(x => x.end >= today && x.start <= today);
  const rem = valid.reduce((s, x) => s + x.left, 0);
  const lost = g.filter(x => x.end < today).reduce((s, x) => s + x.left, 0);

  $('mRem').innerHTML = `${fmt(rem)}<small>日</small>`;
  // 「残り」と同じく、いま有効な付与の中で数える。有効な付与の日数 = 取得済み + 予定 + 残り
  const planned = valid.reduce((s, x) => s + x.planned, 0);
  const taken = valid.reduce((s, x) => s + x.used, 0) - planned;
  const granted = valid.reduce((s, x) => s + x.days, 0);
  $('mUsedPct').textContent = granted ? `${Math.round(taken / granted * 100)}%` : '';
  $('mUsed').innerHTML = `${fmt(taken)}<small>日</small>`
    + (granted ? `<div class="mini"><div style="width:${taken / granted * 100}%"></div>${planned ? `<div class="plan" style="width:${planned / granted * 100}%"></div>` : ''}</div>
      <div class="ml" style="font-size:12px">${fmt(granted)}日中${planned ? `・予定 ${fmt(planned)}日` : ''}</div>` : '');
  $('mLost').innerHTML = `${fmt(lost)}<small>日</small>`;
  $('mLost').style.color = lost > 0 ? 'var(--red)' : '';

  const nx = valid.filter(x => x.left > 0).sort((a, b) => a.end.localeCompare(b.end))[0];
  $('mNext').innerHTML = nx
    ? `${fmt(nx.left)}<small>日</small><div class="ml" style="font-size:12px">${nx.end}（あと${dd(today, nx.end)}日）</div>`
    : '-';

  // 再描画で折りたたみが閉じないよう、開いていたものを覚えておく
  const opened = new Set([...document.querySelectorAll('details[data-k][open]')].map(e => e.dataset.k));
  const fold = (k, label, body) => `<details class="old" data-k="${k}" ${opened.has(k) ? 'open' : ''}><summary>${label}</summary>${body}</details>`;

  const grantRow = x => {
    const ex = x.end < today, soon = !ex && dd(today, x.end) <= 60 && x.left > 0;
    const p = x.days ? x.used / x.days * 100 : 0;
    const tag = ex ? (x.left ? `<span class="tag t-p">${Math.round(p)}%使用</span>` : '<span class="tag t-ok">🎉 使い切り</span>')
      : soon ? '<span class="tag t-w">期限間近！</span>' : '';
    return `<div class="li">
      <div class="gi"><div><b>${fmt(x.days)}日分</b> ${tag}</div><div class="ml">${x.start} 〜 ${x.end}</div></div>
      <div class="bar"><div style="width:${p}%"></div></div>
      <div class="gr">${ex ? `使用 ${fmt(x.used)}日${x.left ? `<div class="lost">失効 ${fmt(x.left)}日</div>` : ''}` : `残 ${fmt(x.left)}日`}</div>
      <button class="del" onclick="delG(${x.i})">削除</button></div>`;
  };
  const expired = g.filter(x => x.end < today).sort((a, b) => b.end.localeCompare(a.end));
  $('gList').innerHTML = g.length
    ? g.filter(x => x.end >= today).sort((a, b) => a.end.localeCompare(b.end)).map(grantRow).join('')
      + (expired.length ? fold('expired', `期限が終わった有休（${expired.length}件・平均 ${Math.round(expired.reduce((s, x) => s + x.used, 0) / expired.reduce((s, x) => s + x.days, 0) * 100)}%使用）`, expired.map(grantRow).join('')) : '')
    : '<div class="empty">右上の「＋ 有休を追加」から登録してね 🎁</div>';

  // 年5日取得義務：10日以上の付与の付与日から1年間。今日を含む期間がなければ直近に終わった期間を出す
  const periods = g.filter(x => x.days >= 10 && x.start <= today)
    .map(x => ({ start: x.start, end: addY(x.start, 1) }))
    .sort((a, b) => b.start.localeCompare(a.start));
  const per = periods.find(p => p.end >= today) || periods[0];
  if (per) {
    const inPer = u => u.date >= per.start && u.date <= per.end;
    const n = sumPaid(u => inPer(u) && u.date <= today), m = sumPaid(u => inPer(u) && u.date > today);
    const status = per.end < today
      ? (n >= 5 ? `🎉 達成（${per.end}で終了）` : `⚠️ ${fmt(5 - n)}日不足（${per.end}で終了）`)
      : (n >= 5 ? '🎉 達成！' : `${per.end}までにあと${fmt(5 - n)}日${m ? `（予定 ${fmt(m)}日）` : ''}`);
    const wN = Math.min(n / 5, 1) * 100, wM = Math.min((n + m) / 5, 1) * 100 - wN;
    $('duty').innerHTML = `<div class="duty">
      <div class="duty-h"><span>🎯 年5日の取得義務</span><b>${fmt(n)}<small> / 5日</small></b></div>
      <div class="bar"><div style="width:${wN}%"></div>${wM > 0 ? `<div class="plan" style="width:${wM}%"></div>` : ''}</div>
      <div class="duty-s">${status}</div></div>`;
  } else $('duty').innerHTML = '';

  const useRow = u => `<div class="li"><div style="flex:1">
      <b>${u.date}（${youbi(u.date)}）</b>
      <span class="chip ${u.days == 0.5 ? 'c-half' : 'c-full'}">${u.days == 0.5 ? '半休' : '全休'}</span>
      ${u.memo ? `<span class="ml">${esc(u.memo)}</span>` : ''}
      ${paid[u.i] < u.days ? '<span class="tag t-d">残日数不足</span>' : ''}</div>
      <button class="del" onclick="editU(${u.i})">編集</button></div>`;
  const year = today.slice(0, 4);
  const uses = S.uses.map((u, i) => ({ ...u, i })).sort((a, b) => b.date.localeCompare(a.date));
  const pastYears = [...new Set(uses.filter(u => u.date.slice(0, 4) < year).map(u => u.date.slice(0, 4)))];
  $('uList').innerHTML = uses.length
    ? uses.filter(u => u.date.slice(0, 4) >= year).map(useRow).join('')
      + pastYears.map(y => {
        const ys = uses.filter(u => u.date.startsWith(y));
        return fold(y, `${y}年（${fmt(ys.reduce((s, u) => s + u.days, 0))}日）`, ys.map(useRow).join(''));
      }).join('')
    : '<div class="empty">休んだら記録しよう ✈️</div>';

  const last = lastExport(), stale = last ? dd(last, today) : null;
  $('warn').innerHTML = (S.grants.length || S.uses.length) && (stale === null || stale >= 14)
    ? `<div class="warn">💾 ${stale === null ? 'まだ一度もバックアップしていません' : `前回のバックアップから${stale}日たっています`}。下の「バックアップを保存」からiCloud Driveに保存しておこう</div>`
    : '';

  save();
}

window.delG = i => { if (confirm(`${S.grants[i].start}にもらった${fmt(S.grants[i].days)}日分を削除しますか？`)) { S.grants.splice(i, 1); render(); } };
const dayTotal = (d, skip) => S.uses.reduce((s, u, i) => i !== skip && u.date === d ? s + u.days : s, 0);

let editing = -1;
window.editU = i => {
  const u = S.uses[i]; editing = i;
  $('eDate').value = u.date; $('eDays').value = String(u.days); $('eMemo').value = u.memo || '';
  $('eErr').textContent = ''; $('uDlg').showModal();
};

// ホーム画面のアプリは再読み込みされずに復帰するので、表示に戻るたびに日付を確かめる
document.addEventListener('visibilitychange', () => {
  const t = iso(new Date());
  if (document.visibilityState !== 'visible' || t === today) return;
  if ($('uDate').value === today) $('uDate').value = t;
  if ($('gStart').value === today) { $('gStart').value = t; $('gEnd').value = addY(t, 2); }
  today = t; render();
});

$('gStart').addEventListener('input', () => { $('gEnd').value = addY($('gStart').value, 2); });
['gDays', 'gStart', 'gEnd'].forEach(id => $(id).addEventListener('input', () => $('gErr').textContent = ''));
['uDate', 'uDays'].forEach(id => $(id).addEventListener('input', () => $('uErr').textContent = ''));

$('gOpen').onclick = () => { $('gErr').textContent = ''; $('gDlg').showModal(); };
$('gCancel').onclick = () => $('gDlg').close();
$('eCancel').onclick = () => $('uDlg').close();
// ダイアログ自身の余白をタップしても target は dialog になるため、枠の外かどうかは座標で見る
['gDlg', 'uDlg'].forEach(id => $(id).addEventListener('click', e => {
  const dlg = $(id), r = dlg.getBoundingClientRect();
  if (e.target === dlg && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) dlg.close();
}));
['eDate', 'eDays'].forEach(id => $(id).addEventListener('input', () => $('eErr').textContent = ''));

$('eSave').onclick = () => {
  const d = $('eDate').value, n = parseFloat($('eDays').value);
  if (!d) return $('eErr').textContent = '取得日を入力してください';
  if (dayTotal(d, editing) + n > 1) return $('eErr').textContent = 'その日はすでに1日分記録済みです';
  S.uses[editing] = { date: d, days: n, memo: $('eMemo').value.trim() };
  $('uDlg').close(); render();
};
$('eDel').onclick = () => {
  if (!confirm('この記録を削除しますか？')) return;
  S.uses.splice(editing, 1); $('uDlg').close(); render();
};

$('gAdd').onclick = () => {
  const d = parseFloat($('gDays').value), s = $('gStart').value, e = $('gEnd').value;
  if (!(d > 0)) return $('gErr').textContent = '日数を入力してください';
  if (!Number.isInteger(d * 2)) return $('gErr').textContent = '日数は0.5日単位で入力してください';
  if (!s || !e) return $('gErr').textContent = 'もらった日と期限を入力してください';
  if (e < s) return $('gErr').textContent = '期限はもらった日より後にしてください';
  S.grants.push({ days: d, start: s, end: e }); $('gDlg').close(); render(); pop('mRem');
};

$('uAdd').onclick = () => {
  const d = $('uDate').value, n = parseFloat($('uDays').value);
  if (!d) return $('uErr').textContent = '取得日を入力してください';
  if (dayTotal(d, -1) + n > 1) return $('uErr').textContent = 'その日はすでに1日分記録済みです';
  S.uses.push({ date: d, days: n, memo: $('uMemo').value.trim() });
  $('uMemo').value = ''; render(); pop('mRem'); pop('mUsed'); confetti();
};

$('exp').onclick = async () => {
  const name = 'yukyu-watch.json';
  const file = new File([JSON.stringify(S, null, 1)], name, { type: 'application/json' });
  try {
    // PCの共有シートには「ファイルに保存」がないため、共有はタッチ端末に限る
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  } catch (e) {
    if (e.name !== 'AbortError') $('msg').textContent = '保存できませんでした';
    return;
  }
  markExported(); render();
  $('msg').textContent = '保存しました';
};
$('imp').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    let d;
    try { d = JSON.parse(t); if (!isData(d)) throw 0; }
    catch (_) { $('msg').textContent = 'ファイル形式が違います'; return; }
    if ((S.grants.length || S.uses.length) &&
      !confirm(`今のデータ（有休${S.grants.length}件・休んだ記録${S.uses.length}件）は、このファイルの内容（有休${d.grants.length}件・休んだ記録${d.uses.length}件）で上書きされます。復元しますか？`)) return;
    S = d; render(); $('msg').textContent = '復元しました';
  });
  e.target.value = '';
};

render();
</script>
</body>
</html>
